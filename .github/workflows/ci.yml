name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  quality-gate:
    name: Tests and self-gate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: inotify

      - name: Verify native watcher support
        run: php -r 'if (!extension_loaded("inotify")) { fwrite(STDERR, "inotify extension is required by CI\n"); exit(1); }'

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests
        run: composer test

      - name: Architecture gate (no layer violations)
        run: php bin/engine.php architecture-gate . --fail-on=any

      - name: No unclassified nodes
        run: |
          php bin/engine.php architecture . > arch.json
          php -r '$d = json_decode(file_get_contents("arch.json"), true, 512, JSON_THROW_ON_ERROR); if (!isset($d["layerDistribution"])) { fwrite(STDERR, "FAIL: missing layerDistribution in output\n"); exit(1); } $u = $d["layerDistribution"]["Unknown"] ?? 0; if ($u > 0) { fwrite(STDERR, "FAIL: {$u} unclassified (Unknown) nodes\n"); exit(1); } echo "OK: 0 unclassified nodes\n";'

      - name: No cross-class dependency cycles
        run: |
          php bin/engine.php cycles . > cycles.json
          php -r '$d = json_decode(file_get_contents("cycles.json"), true, 512, JSON_THROW_ON_ERROR); if (!array_key_exists("cycles", $d)) { fwrite(STDERR, "FAIL: missing cycles in output\n"); exit(1); } $bad = 0; foreach ($d["cycles"] as $c) { if (($c["severity"] ?? "") !== "INFO") { $bad++; } } if ($bad > 0) { fwrite(STDERR, "FAIL: {$bad} cross-class cycle(s)\n"); exit(1); } echo "OK: no cross-class cycles\n";'
